<div
  class="sidebar"
  [class.expanded]="isExpanded"
>

  <!-- ===================================================== -->
  <!-- HEADER -->
  <!-- ===================================================== -->

  <div class="sidebar-header">

    <div class="brand">

      <div class="logo-box">

        <img
          src="/favicon.ico"
          alt="logo"
        >

      </div>

      <div class="header-text">

        <span class="title">
          HelpWithTEACCH
        </span>

        <small class="subtitle">
          Apoyo educativo
        </small>

      </div>

    </div>

  </div>


  <div class="divider"></div>


  <!-- ===================================================== -->
  <!-- MENU -->
  <!-- ===================================================== -->

  <div class="sidebar-body">


    <!-- =================================================== -->
    <!-- GENERAL -->
    <!-- =================================================== -->

    <div class="menu-section">

      <span
        class="section-title"
        *ngIf="isExpanded"
      >
        GENERAL
      </span>


      <div
        class="menu-item"
        [class.active]="isActive('/home')"
        (click)="goTo('/home')"
      >

        <div class="icon-box">

          <i class="fi fi-br-house-chimney-blank"></i>

        </div>

        <span class="label">
          Inicio
        </span>

      </div>

    </div>


    <!-- =================================================== -->
    <!-- USUARIOS -->
    <!-- =================================================== -->

    <div
      class="menu-section"
      *ngIf="isAdmin"
    >

      <span
        class="section-title"
        *ngIf="isExpanded"
      >
        USUARIOS
      </span>


      <div
        class="divider section-divider"
        *ngIf="!isExpanded"
      ></div>


      <!-- GESTIÓN DE USUARIOS -->

      <div
        class="menu-item"
        [class.active]="isActive('/usuario')"
        (click)="goTo('/usuario')"
      >

        <div class="icon-box">

          <i class="fi fi-br-users"></i>

        </div>

        <span class="label">
          Gestión de usuarios
        </span>

      </div>


      <!-- ROLES / PERMISOS -->

      <div
        class="menu-item"
        [class.active]="isActive('/roles')"
        (click)="goTo('/roles')"
      >

        <div class="icon-box">

          <i class="fi fi-br-shield-check"></i>

        </div>

        <span class="label">
          Roles / Permisos
        </span>

      </div>

    </div>


    <!-- =================================================== -->
    <!-- NIÑOS -->
    <!-- =================================================== -->

    <div class="menu-section">

      <span
        class="section-title"
        *ngIf="isExpanded"
      >
        NIÑOS
      </span>


      <div
        class="divider section-divider"
        *ngIf="!isExpanded"
      ></div>


      <div
        class="menu-item"
        [class.active]="isActive('/nino')"
        (click)="goTo('/nino')"
      >

        <div class="icon-box">

          <i class="fi fi-br-child-head"></i>

        </div>

        <span class="label">
          Gestión de niños
        </span>

      </div>

    </div>


    <!-- =================================================== -->
    <!-- EVALUACIONES -->
    <!-- =================================================== -->

    <div class="menu-section">

      <span
        class="section-title"
        *ngIf="isExpanded"
      >
        EVALUACIONES
      </span>


      <div
        class="divider section-divider"
        *ngIf="!isExpanded"
      ></div>


      <!-- EVALUACIONES -->

      <div
        class="menu-item"
        [class.active]="isActive('/evaluaciones')"
        (click)="goTo('/evaluaciones')"
      >

        <div class="icon-box">

          <i class="fi fi-br-brain"></i>

        </div>

        <span class="label">
          Evaluaciones
        </span>

      </div>


      <!-- PRUEBAS -->

      <div
        class="menu-item"
        *ngIf="isAdmin"
        [class.active]="isActive('/pruebas')"
        (click)="goTo('/pruebas')"
      >

        <div class="icon-box">

          <i class="fi fi-br-clipboard-list-check"></i>

        </div>

        <span class="label">
          Pruebas
        </span>

      </div>


      <!-- VERSIONES -->

      <div
        class="menu-item"
        *ngIf="isAdmin"
        [class.active]="isActive('/versiones')"
        (click)="goTo('/versiones')"
      >

        <div class="icon-box">

          <i class="fi fi-br-document"></i>

        </div>

        <span class="label">
          Versiones
        </span>

      </div>

    </div>


    <!-- =================================================== -->
<!-- RESULTADOS -->
<!-- =================================================== -->

<div class="menu-section">

  <span
    class="section-title"
    *ngIf="isExpanded"
  >
    RESULTADOS
  </span>


  <div
    class="divider section-divider"
    *ngIf="!isExpanded"
  ></div>


  <!-- ================================================= -->
  <!-- RESULTADOS Q-CHAT -->
  <!-- ================================================= -->

  <div
    class="menu-item"
    [class.active]="isActive('/resultados')"
    (click)="goTo('/resultados')"
  >

    <div class="icon-box">

      <i class="fi fi-br-chart-histogram"></i>

    </div>

    <span class="label">
      Resultados
    </span>

  </div>


  <!-- ================================================= -->
  <!-- RESULTADOS FINALES -->
  <!-- ================================================= -->

  <div
    class="menu-item"
    [class.active]="
      isActive('/evaluaciones/resultados-finales')
    "
    (click)="goTo('/evaluaciones/resultados-finales')"
  >

    <div class="icon-box">

      <i class="fi fi-br-chart-pie"></i>

    </div>

    <span class="label">
      Resultados finales
    </span>

  </div>


  <!-- ================================================= -->
  <!-- PREDICCIONES ML -->
  <!-- ================================================= -->

  <div
    class="menu-item"
    [class.active]="isActive('/predicciones')"
    (click)="goTo('/predicciones')"
  >

    <div class="icon-box">

      <i class="fi fi-br-chart-line-up"></i>

    </div>

    <span class="label">
      Predicciones ML
    </span>

  </div>

</div>
    <!-- =================================================== -->
    <!-- SISTEMA -->
    <!-- =================================================== -->

    <div
      class="menu-section"
      *ngIf="isAdmin"
    >

      <span
        class="section-title"
        *ngIf="isExpanded"
      >
        SISTEMA
      </span>


      <div
        class="divider section-divider"
        *ngIf="!isExpanded"
      ></div>


      <div
        class="menu-item"
        [class.active]="isActive('/auditoria')"
        (click)="goTo('/auditoria')"
      >

        <div class="icon-box">

          <i class="fi fi-br-time-past"></i>

        </div>

        <span class="label">
          Auditoría
        </span>

      </div>

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- FOOTER -->
  <!-- ===================================================== -->

  <div class="divider"></div>


  <div class="sidebar-footer">

    <button
      class="toggle-btn"
      type="button"
      (click)="toggleSidebar()"
    >

      <i
        class="fi fi-br-circle-half-stroke"
        [class.icon-mirror]="!isExpanded"
      ></i>

    </button>

  </div>

</div>
